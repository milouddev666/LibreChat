version: 1.3.14

cache: true

endpoints:
  custom:
    - name: "AgentRouter"
      apiKey: "${AGENTROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "nvidia/nemotron-3-ultra-550b-a55b"
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "nemotron-3"
      modelDisplayLabel: "AgentRouter"

    - name: "Gemini"
      apiKey: "${GEMINI_API_KEY}"
      baseURL: "https://generativelanguage.googleapis.com/v1beta/openai/"
      models:
        default:
          - "gemini-2.5-flash"
          - "gemini-2.5-pro"
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "gemini-2.5-flash"
      modelDisplayLabel: "Gemini"
