version: 1.3.14

cache: true

endpoints:
  custom:
    - name: "AgentRouter"
      apiKey: "${AGENTROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "openrouter/free"
          - "openai/gpt-oss-120b:free"
          - "openai/gpt-oss-20b:free"
          - "qwen/qwen3-coder:free"
          - "qwen/qwen3-235b-a22b:free"
          - "deepseek/deepseek-r1-0528:free"
          - "deepseek/deepseek-chat-v3-0324:free"
          - "meta-llama/llama-3.3-70b-instruct:free"
          - "google/gemma-3-27b-it:free"
          - "google/gemma-3-12b-it:free"
          - "google/gemma-3-4b-it:free"
          - "mistralai/mistral-small-3.1-24b-instruct:free"
          - "moonshotai/kimi-k2:free"
          - "nvidia/nemotron-nano-9b-v2:free"
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "openai/gpt-oss-20b:free"
      modelDisplayLabel: "OpenRouter Free"

    - name: "Gemini"
      apiKey: "${GEMINI_API_KEY}"
      baseURL: "https://generativelanguage.googleapis.com/v1beta/openai/"
      models:
        default:
          - "gemini-2.5-flash"
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "gemini-2.5-flash"
      modelDisplayLabel: "Gemini"

    - name: "NanoBridge"
      apiKey: "${NANOBRIDGE_API_KEY}"
      baseURL: "https://api.nanobridge.net/v1"
      models:
        default: []
        fetch: true
      titleConvo: true
      titleMethod: "completion"
      modelDisplayLabel: "NanoBridge"
